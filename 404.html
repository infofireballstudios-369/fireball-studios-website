<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Fireball Studios</title>
  <meta name="robots" content="noindex, follow">
  <meta name="description" content="The page you're looking for doesn't exist. Explore Fireball Studios' 3D visualisation, CAD and engineering services instead.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="/style.css">
  <style>
    .error-hero{
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 120px 24px 80px;
      background: linear-gradient(135deg, #F8FAFC 0%, #F1F5F9 100%);
      text-align: center;
    }
    .error-inner{
      max-width: 640px;
      margin: 0 auto;
    }
    .error-code{
      font-size: clamp(6rem, 18vw, 12rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.05em;
      color: var(--primary);
      margin: 0 0 8px;
    }
    .error-code .highlight{
      color: var(--secondary);
    }
    .error-hero h1{
      font-size: clamp(1.5rem, 3vw, 2.2rem);
      margin: 0 0 18px;
      color: var(--primary);
    }
    .error-hero p{
      font-size: 1.05rem;
      line-height: 1.7;
      color: #475569;
      max-width: 520px;
      margin: 0 auto 36px;
    }
    .error-actions{
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 56px;
    }
    .error-links{
      display: flex;
      gap: 22px;
      flex-wrap: wrap;
      justify-content: center;
      padding-top: 40px;
      border-top: 1px solid var(--border);
    }
    .error-links a{
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--secondary);
      transition: opacity .3s;
    }
    .error-links a:hover{
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <section class="error-hero">
    <div class="error-inner">
      <p class="error-code">4<span class="highlight">0</span>4</p>
      <h1>That page has wandered off</h1>
      <p>The page you're looking for doesn't exist, has been moved, or the link you followed was incorrect. Let's get you back to something useful.</p>

      <div class="error-actions">
        <a href="/" class="btn-primary">BACK TO HOMEPAGE <i class="fas fa-arrow-right"></i></a>
        <a href="/contact.html" class="btn-secondary">GET IN TOUCH →</a>
      </div>

      <div class="error-links">
        <a href="/services.html">Services</a>
        <a href="/projects.html">Projects</a>
        <a href="/process.html">Process</a>
        <a href="/industries.html">Industries</a>
        <a href="/about.html">About</a>
      </div>
    </div>
  </section>

</body>
</html>
