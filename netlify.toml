[build]
  command = "npm run build"
  publish = ".next"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"
  NEXT_TELEMETRY_DISABLED = "1"

[functions]
  node_bundler = "esbuild"

[context.deploy-preview.environment]
  SITE_NOINDEX = "true"
  NEXT_PUBLIC_ENABLE_ANALYTICS = "false"

[context.branch-deploy.environment]
  SITE_NOINDEX = "true"
  NEXT_PUBLIC_ENABLE_ANALYTICS = "false"

[context.production.environment]
  SITE_NOINDEX = "false"
  # Existing stream: the owner confirmed Enhanced Measurement is disabled.
  NEXT_PUBLIC_GA_MEASUREMENT_ID = "G-7RV5GM0GCF"
  NEXT_PUBLIC_ENABLE_ANALYTICS = "true"

[[headers]]
  for = "/atlases/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Robots-Tag = "noindex"

[[redirects]]
  from = "https://www.fireballstudios.co.uk/*"
  to = "https://fireballstudios.co.uk/:splat"
  status = 301
  force = true
