name: Build and deploy the standalone static site

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fireball-static-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Read this repository's Pages URL
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=moderate
      - name: Validate the managed enquiry form build
        run: npm run build:capture
      - name: Generate and validate static files
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          FORM_PROVIDER: ${{ vars.FORM_PROVIDER || 'formsubmit' }}
          FORMSPREE_ENDPOINT: ${{ vars.FORMSPREE_ENDPOINT }}
          NETLIFY_FORM_URL: ${{ vars.NETLIFY_FORM_URL }}
          NOINDEX: ${{ vars.FIREBALL_INDEXING_ENABLED == 'true' && 'false' || 'true' }}
      - run: npm run check:pages
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish this separate static project
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
